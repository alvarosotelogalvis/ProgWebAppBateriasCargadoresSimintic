<!doctype html>
<!--
  PANTALLA 02 — Login con PIN (usuario ya conocido)
  Referencia visual: 02-login-pin.png · Especificación: ../DESIGN.md §6
  Fondo: degradado principal.
  Componentes: Avatar, PillInput, PinKeypad, PrimaryButton, SecondaryButton (on-gradient).
  Comportamiento: cada tecla pulsada se resalta un instante (.pin-key.active).
  Navegación: LOG IN → 04-dashboard · CANCEL → 01-login.
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>02 Login PIN</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0">
  <link rel="stylesheet" href="styles.css">
  <style>
    .user-avatar {
      width: 96px; height: 96px; border-radius: 50%;
      background: #FFFFFF;
      display: flex; align-items: flex-end; justify-content: center; overflow: hidden;
      margin: 24px auto 12px;
    }
    .user-avatar .material-symbols-rounded { font-size: 92px; color: var(--accent); margin-bottom: -10px; }
  </style>
</head>
<body>
  <div class="screen">
    <div class="deco-circle" style="width:160px;height:160px;right:-80px;top:40px"></div>
    <div class="deco-circle" style="width:200px;height:200px;left:-100px;bottom:120px"></div>

    <main class="screen-body" style="align-items:center">
      <!-- Avatar -->
      <div class="user-avatar"><span class="material-symbols-rounded">person</span></div>
      <h1 class="h1 center">Karina Buys</h1>

      <!-- PillInput -->
      <div class="pill-input" style="margin-top:16px;width:88%">Please enter your password</div>

      <!-- PinKeypad -->
      <div class="card-inner pin-keypad" style="width:88%;margin-top:20px">
        <div class="pin-key"><span>1</span></div>
        <div class="pin-key active"><span>2</span></div>
        <div class="pin-key"><span>3</span></div>
        <div class="pin-key"><span>4</span></div>
        <div class="pin-key"><span>5</span></div>
        <div class="pin-key"><span>6</span></div>
        <div class="pin-key"><span>7</span></div>
        <div class="pin-key"><span>8</span></div>
        <div class="pin-key"><span>9</span></div>
        <div class="pin-key"></div>
        <div class="pin-key"><span>0</span></div>
        <div class="pin-key"><span class="material-symbols-rounded">backspace</span></div>
      </div>

      <!-- Botones -->
      <div class="button-row" style="margin-top:20px;width:88%;justify-content:space-between">
        <button class="primary-button">Log in</button>
        <button class="secondary-button on-gradient">Cancel</button>
      </div>
    </main>
  </div>
</body>
</html>
