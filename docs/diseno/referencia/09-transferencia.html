<!doctype html>
<!--
  PANTALLA 09 — Transferir dinero (confirmación con PIN)
  Referencia visual: 09-transferencia.png · Especificación: ../DESIGN.md §6
  Fondo: degradado principal, Card llena la pantalla hasta la BottomNav.
  Componentes: TransferSummary (monto + chips de cuenta amarillos), PillInput (outlined), PinKeypad, BottomNav.
  Comportamiento: al completar el PIN se confirma la transferencia (pantalla de éxito por definir).
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>09 Transferencia</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="screen">
    <main class="screen-body" style="padding-bottom:0">
      <section class="card fill" style="border-radius:var(--radius-card) var(--radius-card) 0 0;gap:16px;align-items:center">
        <h2 class="h2">Transferring Money</h2>

        <!-- TransferSummary -->
        <span class="amount-xl">$1,100.00</span>
        <div class="row gap-8" style="width:100%;justify-content:space-between">
          <div class="stack gap-4" style="align-items:center">
            <span class="caption">From Account</span>
            <span class="account-chip">000 123 456</span>
          </div>
          <span class="material-symbols-rounded" style="color:var(--text-primary);margin-top:14px">arrow_forward</span>
          <div class="stack gap-4" style="align-items:center">
            <span class="caption">To Account</span>
            <span class="account-chip">012 555 888</span>
          </div>
        </div>

        <!-- PillInput (outlined sobre blanco) -->
        <div class="pill-input outlined" style="margin-top:8px">Enter your PIN to confirm</div>

        <!-- PinKeypad -->
        <div class="card-inner pin-keypad" style="width:100%">
          <div class="pin-key"><span>1</span></div>
          <div class="pin-key active"><span>2</span></div>
          <div class="pin-key"><span>3</span></div>
          <div class="pin-key"><span>4</span></div>
          <div class="pin-key"><span>5</span></div>
          <div class="pin-key"><span>6</span></div>
          <div class="pin-key"><span>7</span></div>
          <div class="pin-key"><span>8</span></div>
          <div class="pin-key"><span>9</span></div>
          <div class="pin-key"></div>
          <div class="pin-key"><span>0</span></div>
          <div class="pin-key"><span class="material-symbols-rounded">backspace</span></div>
        </div>
      </section>
    </main>

    <!-- BottomNav -->
    <nav class="bottom-nav">
      <div class="nav-item"><span class="material-symbols-rounded">home</span>Home</div>
      <div class="nav-item active"><span class="material-symbols-rounded">swap_horiz</span>Transaction</div>
      <div class="nav-item"><span class="material-symbols-rounded">notifications</span>Notification</div>
      <div class="nav-item"><span class="material-symbols-rounded">person</span>Account</div>
    </nav>
  </div>
</body>
</html>
