<!doctype html>
<!--
  PANTALLA 03 — Registro
  Referencia visual: 03-registro.png · Especificación: ../DESIGN.md §6
  Fondo: degradado principal con una tarjeta blanca grande (Card) casi a pantalla completa.
  Componentes: Card, TextField, PasswordField, Checkbox, PrimaryButton, SecondaryButton, TextLink.
  Navegación: SIGN UP → 05-vincular-tarjeta · CANCEL / Log in → 01-login.
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>03 Registro</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="screen">
    <div class="deco-circle" style="width:160px;height:160px;right:-80px;top:-30px"></div>

    <main class="screen-body">
      <!-- Card -->
      <section class="card fill" style="gap:14px;padding:28px 24px">
        <h2 class="h2" style="margin-bottom:10px">Sign up your bank account</h2>

        <div class="text-field placeholder">Your Name</div>
        <div class="text-field placeholder">Bank Account</div>
        <div class="text-field placeholder">Mobile phone number</div>
        <div class="text-field placeholder">Email</div>

        <!-- PasswordField -->
        <div>
          <div class="text-field placeholder">Password <span class="material-symbols-rounded">visibility</span></div>
          <p class="helper-text">Use 6 characters with a mix of numbers and letters</p>
        </div>

        <!-- Checkbox -->
        <div class="checkbox-row" style="margin-top:6px">
          <div class="checkbox"></div>
          <span>By signing up, you agree to Bank's Term of Use &amp; Privacy Policy</span>
        </div>

        <!-- Botones -->
        <div class="button-row" style="margin-top:10px">
          <button class="primary-button">Sign up</button>
          <span class="caption" style="color:var(--text-primary)">or</span>
          <button class="secondary-button">Cancel</button>
        </div>

        <div class="grow"></div>
        <p class="center" style="font-size:12px;color:var(--text-primary)">Already signed up? <a class="text-link">Log in</a></p>
      </section>
    </main>
  </div>
</body>
</html>
