<!doctype html>
<!--
  PANTALLA 10 — Pago con código QR
  Referencia visual: 10-pago-qr.png · Especificación: ../DESIGN.md §6
  Fondo: degradado principal, Card llena la pantalla hasta la BottomNav.
  Componentes: AmountInput (moneda + monto), TextField con label, QrCard, TextLink, BottomNav.
  El QR de abajo es un marcador de posición: en Flutter se genera con el paquete qr_flutter
  a partir de los datos del pago (monto, moneda, cuenta).
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>10 Pago QR</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="screen">
    <main class="screen-body" style="padding-bottom:0">
      <section class="card fill" style="border-radius:var(--radius-card) var(--radius-card) 0 0;gap:12px">
        <h2 class="h2" style="margin-bottom:8px">Payment with QR Code</h2>

        <!-- AmountInput -->
        <div>
          <span class="label" style="text-transform:uppercase">Amount</span>
          <div class="text-field amount-input">
            <span class="currency">USD <span class="material-symbols-rounded">expand_more</span></span>
            <span class="amount-xl" style="font-size:24px">1,240.00</span>
          </div>
        </div>

        <!-- TextField con label -->
        <div>
          <span class="label" style="text-transform:uppercase">From Bank Account</span>
          <div class="text-field" style="justify-content:flex-end;height:48px;font-size:20px;font-weight:700">00 123 456</div>
        </div>

        <!-- QrCard: 160x160, fondo blanco, sombra floating, radio 16 -->
        <div class="card-inner" style="width:180px;height:180px;margin:20px auto 8px;display:flex;align-items:center;justify-content:center">
          <svg viewBox="0 0 21 21" width="150" height="150" shape-rendering="crispEdges" aria-label="Código QR (marcador de posición)">
            <g fill="#1E1E2E">
              <path d="M0 0h7v7H0zM1 1v5h5V1zM2 2h3v3H2z" fill-rule="evenodd"/>
              <path d="M14 0h7v7h-7zM15 1v5h5V1zM16 2h3v3h-3z" fill-rule="evenodd"/>
              <path d="M0 14h7v7H0zM1 15v5h5v-5zM2 16h3v3H2z" fill-rule="evenodd"/>
              <path d="M8 0h2v2H8zM11 1h2v3h-2zM8 3h2v3H8zM9 8h3v2H9zM13 8h2v3h-2zM16 8h2v2h-2zM19 9h2v3h-2zM0 8h3v2H0zM4 9h3v2H4zM8 11h2v3H8zM11 12h3v2h-3zM15 12h3v2h-3zM8 15h3v2H8zM12 15h2v3h-2zM15 15h3v2h-3zM19 14h2v4h-2zM9 18h2v3H9zM14 19h3v2h-3zM18 19h3v2h-3zM2 11h2v2H2zM5 12h2v1H5z"/>
            </g>
          </svg>
        </div>

        <p class="center" style="font-size:12px;color:var(--text-primary)">Can't scan the QR Code?<br>Try <a class="text-link">Barcode Bar</a></p>
      </section>
    </main>

    <!-- BottomNav -->
    <nav class="bottom-nav">
      <div class="nav-item active"><span class="material-symbols-rounded">home</span>Home</div>
      <div class="nav-item"><span class="material-symbols-rounded">swap_horiz</span>Transaction</div>
      <div class="nav-item"><span class="material-symbols-rounded">notifications</span>Notification</div>
      <div class="nav-item"><span class="material-symbols-rounded">person</span>Account</div>
    </nav>
  </div>
</body>
</html>
