<!doctype html>
<!--
  PANTALLA 01 — Login
  Referencia visual: 01-login.png · Especificación: ../DESIGN.md §6
  Fondo: degradado principal (gradient.start → gradient.end).
  Componentes: Logo, PillInput, PrimaryButton, TextLink.
  Navegación: LOG IN → 04-dashboard · Sign Up → 03-registro.
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>01 Login</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0">
  <link rel="stylesheet" href="styles.css">
  <style>
    .logo {
      width: 120px; height: 120px; border-radius: 50%;
      background: #FFFFFF;
      display: flex; align-items: center; justify-content: center;
      margin: 64px auto 20px;
    }
    /* Símbolo "8" de dos anillos entrelazados, color primary */
    .logo-mark { font-size: 84px; font-weight: 800; color: var(--gradient-start); line-height: 1; }
  </style>
</head>
<body>
  <div class="screen">
    <div class="deco-circle" style="width:220px;height:220px;left:-110px;bottom:40px"></div>
    <div class="deco-circle" style="width:140px;height:140px;right:-70px;top:-40px"></div>

    <main class="screen-body" style="align-items:center">
      <!-- Logo -->
      <div class="logo"><span class="logo-mark">8</span></div>
      <h1 class="h1 center" style="font-size:28px">Eight Bank</h1>
      <p class="center" style="font-size:13px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;margin-top:4px">Mobile App</p>

      <!-- PillInput -->
      <div class="pill-input" style="margin-top:56px;width:88%">Please enter your password</div>

      <!-- PrimaryButton -->
      <button class="primary-button small" style="margin-top:16px">Log in</button>

      <div class="grow"></div>

      <!-- Enlaces inferiores -->
      <a class="text-link on-gradient" style="font-size:12px">Forgot Password?</a>
      <p style="font-size:12px;margin:10px 0 24px">New to Bank App? <a class="text-link on-gradient">Sign Up</a></p>
    </main>
  </div>
</body>
</html>
