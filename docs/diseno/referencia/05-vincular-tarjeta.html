<!doctype html>
<!--
  PANTALLA 05 — Vincular tarjeta bancaria
  Referencia visual: 05-vincular-tarjeta.png · Especificación: ../DESIGN.md §6
  Fondo: degradado principal.
  Componentes: BankCardCarousel (flechas amarillas), Card, TextField, Checkbox, PrimaryButton, BottomNav.
  Navegación: LINK → 04-dashboard.
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>05 Vincular tarjeta</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="screen">
    <div class="deco-circle" style="width:120px;height:120px;right:-50px;top:30px"></div>

    <main class="screen-body" style="padding-bottom:0">
      <!-- BankCardCarousel -->
      <div class="bank-card-carousel">
        <span class="material-symbols-rounded arrow">chevron_left</span>
        <div class="bank-card"><span>BANK</span><span class="tag">CARD 1</span></div>
        <span class="material-symbols-rounded arrow">chevron_right</span>
      </div>

      <!-- Card (pegada a la BottomNav: sin radio inferior) -->
      <section class="card fill" style="border-radius:var(--radius-card) var(--radius-card) 0 0;gap:14px;padding:24px">
        <h2 class="h2" style="margin-bottom:8px">Link your bank cards</h2>
        <div class="text-field placeholder">Bank Account</div>
        <div class="text-field placeholder">Card Number</div>
        <div class="text-field placeholder">Expiration Date</div>
        <div class="text-field placeholder">PIN Number</div>

        <div class="checkbox-row" style="margin-top:6px">
          <div class="checkbox"></div>
          <span>By signing up, you agree to Bank's Term of Use &amp; Privacy Policy</span>
        </div>

        <div class="button-row" style="margin-top:8px">
          <button class="primary-button small" style="padding:0 32px">Link</button>
        </div>
      </section>
    </main>

    <!-- BottomNav -->
    <nav class="bottom-nav">
      <div class="nav-item active"><span class="material-symbols-rounded">home</span>Home</div>
      <div class="nav-item"><span class="material-symbols-rounded">swap_horiz</span>Transaction</div>
      <div class="nav-item"><span class="material-symbols-rounded">notifications</span>Notification</div>
      <div class="nav-item"><span class="material-symbols-rounded">person</span>Account</div>
    </nav>
  </div>
</body>
</html>
