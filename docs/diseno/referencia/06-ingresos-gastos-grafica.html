<!doctype html>
<!--
  PANTALLA 06 — Ingresos y gastos (tendencia semanal)
  Referencia visual: 06-ingresos-gastos-grafica.png · Especificación: ../DESIGN.md §6
  Fondo: degradado principal, Card llena la pantalla hasta la BottomNav.
  Componentes: LineChart (2 series), SegmentedControl, BarList, BottomNav.
  En Flutter, las gráficas pueden hacerse con fl_chart (LineChart) y
  la BarList con Containers/LinearProgressIndicator personalizados.
  Datos: serie azul = gasto, serie amarilla = ingreso (valores relativos 0..100 abajo).
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>06 Ingresos y gastos - gráfica</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="screen">
    <main class="screen-body" style="padding-bottom:0">
      <section class="card fill" style="border-radius:var(--radius-card) var(--radius-card) 0 0;gap:14px">
        <h2 class="h2">Income &amp; Expense</h2>

        <!-- LineChart
             Eje X: S M T W T F S
             Serie azul (primary):   [20, 70, 30, 55, 90, 35, 70]
             Serie amarilla (accent): [45, 60, 40, 20, 50, 65, 10]
             Vértices: puntos de 3.5 px color chart-point (#2B2B3A). -->
        <svg viewBox="0 0 280 150" width="100%" role="img" aria-label="Gráfica de ingresos y gastos semanal">
          <line x1="8" y1="0" x2="8" y2="125" stroke="#2B2B3A" stroke-width="1"/>
          <line x1="8" y1="125" x2="280" y2="125" stroke="#2B2B3A" stroke-width="1"/>
          <polyline fill="none" stroke="#4A4AF8" stroke-width="2"
            points="30,100 70,38 110,88 150,55 190,12 230,82 270,38"/>
          <polyline fill="none" stroke="#FFC61A" stroke-width="2"
            points="30,70 70,50 110,75 150,100 190,62 230,44 270,112"/>
          <g fill="#2B2B3A">
            <circle cx="30" cy="100" r="3.5"/><circle cx="70" cy="38" r="3.5"/><circle cx="110" cy="88" r="3.5"/>
            <circle cx="150" cy="55" r="3.5"/><circle cx="190" cy="12" r="3.5"/><circle cx="230" cy="82" r="3.5"/>
            <circle cx="270" cy="38" r="3.5"/><circle cx="30" cy="70" r="3.5"/><circle cx="70" cy="50" r="3.5"/>
            <circle cx="110" cy="75" r="3.5"/><circle cx="150" cy="100" r="3.5"/><circle cx="190" cy="62" r="3.5"/>
            <circle cx="230" cy="44" r="3.5"/><circle cx="270" cy="112" r="3.5"/>
          </g>
          <g font-family="Montserrat" font-size="10" font-weight="600" fill="#2E3150" text-anchor="middle">
            <text x="30" y="142">S</text><text x="70" y="142">M</text><text x="110" y="142">T</text>
            <text x="150" y="142">W</text><text x="190" y="142">T</text><text x="230" y="142">F</text><text x="270" y="142">S</text>
          </g>
        </svg>

        <!-- SegmentedControl -->
        <div class="segmented">
          Sort by:
          <span class="segment active">This Week</span>
          <span class="segment">This Month</span>
        </div>

        <!-- BarList: amarilla = ingreso, azul = gasto (ancho = % del máximo) -->
        <div class="bar-list">
          <div class="bar-row"><span class="day-label">S</span>
            <div class="bars"><div class="bar-track"><div class="bar-fill income" style="width:70%"></div></div><div class="bar-track"><div class="bar-fill expense" style="width:35%"></div></div></div>
            <span class="values">$1,200.00<br>$600.00</span></div>
          <div class="bar-row"><span class="day-label">M</span>
            <div class="bars"><div class="bar-track"><div class="bar-fill income" style="width:70%"></div></div><div class="bar-track"><div class="bar-fill expense" style="width:35%"></div></div></div>
            <span class="values">$1,200.00<br>$600.00</span></div>
          <div class="bar-row"><span class="day-label">T</span>
            <div class="bars"><div class="bar-track"><div class="bar-fill income" style="width:60%"></div></div><div class="bar-track"><div class="bar-fill expense" style="width:60%"></div></div></div>
            <span class="values">$1,050.00<br>$1,050.00</span></div>
          <div class="bar-row"><span class="day-label">W</span>
            <div class="bars"><div class="bar-track"><div class="bar-fill income" style="width:12%"></div></div><div class="bar-track"><div class="bar-fill expense" style="width:32%"></div></div></div>
            <span class="values">$175.00<br>$550.00</span></div>
          <div class="bar-row"><span class="day-label">T</span>
            <div class="bars"><div class="bar-track"><div class="bar-fill income" style="width:18%"></div></div><div class="bar-track"><div class="bar-fill expense" style="width:80%"></div></div></div>
            <span class="values">$300.00<br>$1,400.00</span></div>
        </div>
      </section>
    </main>

    <!-- BottomNav -->
    <nav class="bottom-nav">
      <div class="nav-item active"><span class="material-symbols-rounded">home</span>Home</div>
      <div class="nav-item"><span class="material-symbols-rounded">swap_horiz</span>Transaction</div>
      <div class="nav-item"><span class="material-symbols-rounded">notifications</span>Notification</div>
      <div class="nav-item"><span class="material-symbols-rounded">person</span>Account</div>
    </nav>
  </div>
</body>
</html>
