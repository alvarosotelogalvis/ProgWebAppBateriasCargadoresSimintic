<!doctype html>
<!--
  PANTALLA 04 — Inicio / Dashboard
  Referencia visual: 04-dashboard.png · Especificación: ../DESIGN.md §6
  Fondo: degradado SUAVE (clase .soft: gradient.soft.start → mid → end).
  Componentes: BalanceCard, PrimaryButton (small), QuickActionGrid, BottomNav (Home activo).
  Navegación: TRANSFER → 09-transferencia · Transaction → 08-historial ·
              Cards → 05-vincular-tarjeta · QR Code → 10-pago-qr ·
              Income & Expense (acceso adicional) → 06/07.
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>04 Dashboard</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="screen soft">
    <div class="deco-circle" style="width:160px;height:160px;left:60px;top:-110px"></div>
    <div class="deco-circle" style="width:200px;height:200px;left:-120px;bottom:60px"></div>

    <main class="screen-body">
      <!-- BalanceCard -->
      <section class="card balance-card" style="margin-top:12px">
        <div class="top">
          <div class="avatar"><span class="material-symbols-rounded">person</span></div>
          <div class="stack gap-4">
            <span class="h1" style="font-size:18px;color:var(--text-title)">Karina Buys</span>
            <span style="font-size:12px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-secondary)">Balance</span>
            <span class="amount-xl">$4,180.20</span>
          </div>
        </div>
        <div class="button-row" style="justify-content:space-around">
          <button class="primary-button small">Transfer</button>
          <button class="primary-button small">Request</button>
        </div>
      </section>

      <!-- QuickActionGrid (3 columnas en móvil) -->
      <section class="quick-action-grid">
        <div class="quick-action"><div class="circle"><span class="material-symbols-rounded">payments</span></div>Transaction</div>
        <div class="quick-action"><div class="circle"><span class="material-symbols-rounded">contactless</span></div>Payment</div>
        <div class="quick-action"><div class="circle"><span class="material-symbols-rounded">credit_card</span></div>Cards</div>
        <div class="quick-action"><div class="circle"><span class="material-symbols-rounded">shopping_cart</span></div>Commerce</div>
        <div class="quick-action"><div class="circle"><span class="material-symbols-rounded">smartphone</span></div>Cardless</div>
        <div class="quick-action"><div class="circle"><span class="material-symbols-rounded">redeem</span></div>Bonus</div>
        <div class="quick-action"><div class="circle"><span class="material-symbols-rounded">verified_user</span></div>Insurance</div>
        <div class="quick-action"><div class="circle"><span class="material-symbols-rounded">receipt_long</span></div>Obligation</div>
        <div class="quick-action"><div class="circle"><span class="material-symbols-rounded">qr_code_2</span></div>QR Code</div>
      </section>
    </main>

    <!-- BottomNav -->
    <nav class="bottom-nav">
      <div class="nav-item active"><span class="material-symbols-rounded">home</span>Home</div>
      <div class="nav-item"><span class="material-symbols-rounded">swap_horiz</span>Transaction</div>
      <div class="nav-item"><span class="material-symbols-rounded">notifications</span>Notification</div>
      <div class="nav-item"><span class="material-symbols-rounded">person</span>Account</div>
    </nav>
  </div>
</body>
</html>
